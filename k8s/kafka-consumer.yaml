apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
        - name: consumer
          image: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1
          command:
            - /bin/bash
            - -c
            - |
              exec /opt/kafka/bin/kafka-console-consumer.sh \
                --bootstrap-server devops-kafka-kafka-bootstrap:9092 \
                --topic devops-events \
                --group devops-consumer-group
