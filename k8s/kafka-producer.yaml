apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-producer
  namespace: kafka
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: producer
          image: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1
          command:
            - /bin/bash
            - -c
            - |
              for i in $(seq 1 20); do
                echo "DevOps assignment event $i"
                echo "DevOps assignment event $i" | /opt/kafka/bin/kafka-console-producer.sh \
                  --bootstrap-server devops-kafka-kafka-bootstrap:9092 \
                  --topic devops-events
                sleep 2
              done