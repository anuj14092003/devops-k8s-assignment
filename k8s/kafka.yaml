apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: devops-kafka
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false

    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1

    metricsConfig:
      type: strimziMetricsReporter
      values:
        allowList:
          - ".*"

  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"

  entityOperator:
    topicOperator: {}
    userOperator: {}

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: devops-kafka-pool
  namespace: kafka
  labels:
    strimzi.io/cluster: devops-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral